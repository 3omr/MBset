# Starting point for a faculty that has no taxonomy yet. During first-run setup (`mbset.py init`) the agent
# shows these families to the user, adjusts them to how their faculty labels sources, and saves the result
# as ~/.config/mbset/taxonomies/<faculty>.yaml.
name: Generic
description: "Any faculty — generic families, adjust at setup"
multidisciplinary: [Exams]
year_free: ['Exams, Quiz']
rules:
  - {match: 'quiz', tag: 'Exams, Quiz[, Week {week}]'}
  - {match: 'formative', tag: 'Exams, Formative'}
  - {match: 'midterm|mid term', tag: 'Exams, Midterm'}
  - {match: 'final|end of|summ?a?tive', tag: 'Exams, Final'}
  - {has: professor, tag: 'Professor, Dr {professor}', confidence: low}
  - {has: subject, tag: 'Department, {subject}'}
default: {tag: 'External, {label}', confidence: low}
